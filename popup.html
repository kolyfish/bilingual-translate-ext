<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>雙語對照</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="masthead">
    <span class="seal" aria-hidden="true">譯</span>
    <h1>雙語對照</h1>
    <span id="engine-chip" class="chip" data-engine="local">本機</span>
  </header>

  <button id="toggle-page" class="primary" type="button">
    <span>翻譯這一頁</span>
    <kbd>⌥A</kbd>
  </button>
  <p id="status" class="status" aria-live="polite"></p>

  <section aria-labelledby="engine-heading">
    <h2 id="engine-heading">翻譯引擎</h2>
    <fieldset class="segmented">
      <legend class="visually-hidden">翻譯引擎</legend>
      <label><input type="radio" name="engine" value="local"><span>本機</span></label>
      <label><input type="radio" name="engine" value="claude"><span>Claude</span></label>
      <label><input type="radio" name="engine" value="gtx"><span>Google</span></label>
    </fieldset>
    <p id="local-state" class="note"></p>

    <div id="claude-section" class="remote claude" hidden>
      <fieldset class="segmented small">
        <legend class="visually-hidden">Claude 模型</legend>
        <label><input type="radio" name="claude-model" value="claude-opus-5-5"><span>Opus 5.5・品質</span></label>
        <label><input type="radio" name="claude-model" value="claude-haiku-5-5"><span>Haiku 5.5・便宜</span></label>
      </fieldset>

      <div id="claude-key-empty">
        <label class="field-label" for="claude-key">API 金鑰</label>
        <input id="claude-key" class="text-input" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
        <label class="check">
          <input id="claude-remember" type="checkbox">
          <span>記住金鑰（不勾的話，重開 Chrome 要重新貼）</span>
        </label>
        <div class="row-actions">
          <button id="claude-save" class="secondary" type="button">儲存金鑰</button>
        </div>
      </div>

      <div id="claude-key-saved" hidden>
        <p class="key-line"><span id="claude-key-mask"></span><span id="claude-key-where" class="note inline"></span></p>
        <div class="row-actions">
          <button id="claude-test" class="secondary" type="button">測試金鑰</button>
          <button id="claude-remove" class="quiet" type="button">移除金鑰</button>
        </div>
      </div>

      <p id="claude-state" class="note" aria-live="polite"></p>
      <p id="claude-usage" class="note"></p>
      <p class="note warn">翻譯的文字會送到 Anthropic。建議在 Anthropic Console 為這個擴充開一把專用金鑰，並設定每月消費上限。</p>
    </div>
    <div id="gtx-section" class="remote gtx" hidden>
      <p id="gtx-state" class="note"></p>
      <p class="note warn">翻譯的文字會送到 Google 伺服器。短時間翻太多，Google 會暫時拒絕請求。</p>
      <div class="row-actions">
        <button id="gtx-grant" class="secondary" type="button" hidden>允許連到 Google</button>
        <button id="gtx-revoke" class="quiet" type="button" hidden>撤銷權限</button>
      </div>
    </div>
  </section>

  <section aria-labelledby="look-heading">
    <div class="heading-row">
      <h2 id="look-heading">譯文外觀</h2>
      <button id="reset-appearance" class="quiet" type="button">恢復預設</button>
    </div>
    <!-- 決策: 預覽做成真正的「英文一行、中文一行」，跟網頁上看到的一樣 -->
    <div class="sample">
      <p class="sample-en">Reading in two languages, one line at a time.</p>
      <p id="preview">一次一行，用兩種語言閱讀。</p>
    </div>

    <div class="swatches" role="group" aria-label="底色">
      <button type="button" class="swatch" data-color="#8b1a1a" style="--c:#8b1a1a" aria-label="深紅"></button>
      <button type="button" class="swatch" data-color="#2f5d50" style="--c:#2f5d50" aria-label="墨綠"></button>
      <button type="button" class="swatch" data-color="#2b3f6b" style="--c:#2b3f6b" aria-label="靛藍"></button>
      <button type="button" class="swatch" data-color="#7a6500" style="--c:#7a6500" aria-label="暗黃"></button>
      <button type="button" class="swatch" data-color="#fde68a" style="--c:#fde68a" aria-label="淺黃"></button>
      <label class="swatch custom" title="自訂顏色">
        <input type="color" id="bg-color" aria-label="自訂底色">
      </label>
    </div>

    <div class="field">
      <label for="font-scale">字級</label>
      <input type="range" id="font-scale" step="5">
      <output id="font-scale-value" for="font-scale"></output>
    </div>
  </section>

  <section aria-labelledby="place-heading">
    <h2 id="place-heading">顯示位置</h2>
    <fieldset class="segmented">
      <legend class="visually-hidden">網頁譯文位置</legend>
      <label><input type="radio" name="position" value="below"><span>英文下方</span></label>
      <label><input type="radio" name="position" value="above"><span>英文上方</span></label>
    </fieldset>

    <label class="switch-row">
      <span>
        <span class="switch-title">YouTube 自動雙語字幕</span>
        <span class="note">影片要先開啟英文 CC</span>
      </span>
      <input type="checkbox" id="youtube-auto" role="switch">
    </label>
  </section>

  <details class="denylist">
    <summary>不要翻譯的網站</summary>
    <p class="note">一行一個網域，子網域也會擋。網銀、Email、支付、密碼管理器已經內建。</p>
    <textarea id="denylist" placeholder="example.com" spellcheck="false"></textarea>
    <div class="row-actions">
      <button id="save-denylist" class="secondary" type="button">儲存清單</button>
      <span id="denylist-status" class="note" aria-live="polite"></span>
    </div>
  </details>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
