<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; margin: 0; padding: 12px; font-family: system-ui, sans-serif; font-size: 14px; }
    button { font-size: 13px; cursor: pointer; }
    #toggle-page { width: 100%; padding: 8px; font-size: 14px; }
    label { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    section { border-top: 1px solid #ddd; margin-top: 12px; padding-top: 10px; }
    textarea { width: 100%; box-sizing: border-box; height: 80px; font-size: 12px; font-family: ui-monospace, monospace; }
    .note { margin: 6px 0 0; font-size: 12px; color: #666; line-height: 1.5; }
    .warn { color: #b26a00; }
    #status { min-height: 1.5em; }
    input[type="range"] { flex: 1; margin: 0 8px; }
    #preview {
      margin-top: 8px; padding: 4px 8px; border-radius: 4px;
      background: var(--bt-bg); color: var(--bt-fg);
      font-size: calc(var(--bt-scale) * 14px); line-height: 1.6;
    }
  </style>
</head>
<body>
  <button id="toggle-page">翻譯此頁 / 還原（Alt+A）</button>
  <p id="status" class="note"></p>

  <section>
    <strong>翻譯引擎</strong>
    <label class="radio">
      <span>本機（離線，文字不離開電腦）</span>
      <input type="radio" name="engine" value="local">
    </label>
    <p id="local-state" class="note"></p>
    <label class="radio">
      <span>Google 翻譯（線上）</span>
      <input type="radio" name="engine" value="gtx">
    </label>
    <div id="gtx-section" hidden>
      <p id="gtx-state" class="note"></p>
      <p class="note warn">允許後，要翻譯的文字會送到 Google 伺服器。翻太多會被 Google 暫時限流。</p>
      <button id="gtx-grant" hidden>允許使用</button>
      <button id="gtx-revoke" hidden>撤銷權限</button>
    </div>
  </section>

  <section>
    <strong>譯文外觀</strong>
    <label>
      底色
      <input type="color" id="bg-color">
    </label>
    <label>
      字級
      <input type="range" id="font-scale" step="5">
      <span id="font-scale-value"></span>
    </label>
    <div id="preview">這是譯文預覽，文字顏色會依底色自動調整。</div>
    <p class="note"><button id="reset-appearance">恢復預設（深紅、95%）</button></p>
  </section>

  <section>
    <label>
      網頁譯文位置
      <select id="position">
        <option value="below">英文下方</option>
        <option value="above">英文上方</option>
      </select>
    </label>
    <label>
      YouTube 自動雙語字幕
      <input type="checkbox" id="youtube-auto">
    </label>
    <p class="note">YouTube 需先開啟英文 CC 字幕。</p>
  </section>

  <section>
    <strong>自訂黑名單</strong>
    <p class="note">一行一個網域，含子網域。網銀、Email、支付、密碼管理器已經內建。</p>
    <textarea id="denylist" placeholder="example.com"></textarea>
    <button id="save-denylist">儲存</button>
    <span id="denylist-status" class="note"></span>
  </section>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
